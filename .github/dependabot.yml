version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 14
      semver-patch-days: 7
    open-pull-requests-limit: 10
    ignore:
      # React Native bundles a version-matched React renderer. Keep this train
      # frozen until a dedicated platform-upgrade project moves all packages.
      - dependency-name: react
        versions:
          - '>19.2.3'
      - dependency-name: react-native
        versions:
          - '>0.86.2'
      - dependency-name: '@react-native/*'
        versions:
          - '>0.86.2'
    groups:
      react-native-platform:
        applies-to: version-updates
        patterns:
          - react-native
          - '@react-native/*'
      react-native-cli:
        applies-to: version-updates
        patterns:
          - '@react-native-community/*'
      navigation:
        applies-to: version-updates
        patterns:
          - '@react-navigation/*'
          - react-native-safe-area-context
          - react-native-screens

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7

  - package-ecosystem: bundler
    directory: /example
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7

  - package-ecosystem: gradle
    directories:
      - /example/android
      - /packages/core/android
      - /packages/session-replay/android
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
