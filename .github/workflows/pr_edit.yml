name: PR Title and Description Validation

on:
  pull_request:
    types: [opened, reopened, edited, synchronize]

permissions:
  contents: read

jobs:
  validate_pr_title:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted validator scripts
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Validate PR Title
        uses: ./.github/actions/validate-pr-title
  validate_gai_usage_disclosure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted validator scripts
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Validate GAI Usage Disclosure
        uses: ./.github/actions/validate-gai-usage-disclosure
