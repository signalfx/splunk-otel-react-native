name: 'CLA Assistant'
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: read
  pull-requests: write
  statuses: write

jobs:
  ContributorLicenseAgreement:
    if: >-
      github.event_name == 'pull_request_target' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        (
          github.event.comment.body == 'recheck' ||
          github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 'CLA Assistant'
        uses: cla-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # This must be a fine-grained, expiring token restricted to
          # contents:write on splunk/cla-agreement only.
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PAT_CLATOOL }}
        with:
          remote-organization-name: splunk
          remote-repository-name: cla-agreement
          branch: main
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/splunk/cla-agreement/blob/main/CLA.md
          allowlist: dependabot[bot]
