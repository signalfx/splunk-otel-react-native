buildscript {
  ext.getExtOrDefault = {name ->
    return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties['SplunkOtelReactNative_' + name]
  }

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.7.2"
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion')}"
  }
}


apply plugin: "com.android.library"
apply plugin: "kotlin-android"

apply plugin: "com.facebook.react"

def getExtOrIntegerDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties["SplunkOtelReactNative_" + name]).toInteger()
}

// Helper to detect whether New Architecture is enabled
def isNewArchitectureEnabled() {
  return project.hasProperty('newArchEnabled') && project.getProperties().get('newArchEnabled') == 'true'
}

android {
  namespace "com.splunk.otel.reactnative"

  compileSdkVersion getExtOrIntegerDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrIntegerDefault("minSdkVersion")
    targetSdkVersion getExtOrIntegerDefault("targetSdkVersion")
    buildConfigField "boolean", "IS_NEW_ARCHITECTURE_ENABLED", isNewArchitectureEnabled().toString()
  }

  buildFeatures {
    buildConfig true
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lintOptions {
    disable "GradleCompatible"
  }

  compileOptions {
    coreLibraryDesugaringEnabled true
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }

  sourceSets {
    main {
      if (isNewArchitectureEnabled()) {
        java.srcDirs += [
          "generated/java",
          "generated/jni",
          "src/newarch/kotlin"
        ]
      } else {
        java.srcDirs += [
          "src/oldarch/kotlin"
        ]
      }
    }
  }
}

repositories {
  mavenCentral()
  google()
  maven { url "https://splunk.jfrog.io/splunk/splunk-rum-android-releases" }
}

def kotlin_version = getExtOrDefault("kotlinVersion")
def splunkSdkVersion = getExtOrDefault("splunkSdkVersion")

dependencies {
  implementation "com.facebook.react:react-android"
  implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"

  implementation("com.splunk:rum-integration-agent-api:$splunkSdkVersion")
  implementation("com.splunk:rum-integration-anr:$splunkSdkVersion")
  implementation("com.splunk:rum-integration-applicationlifecycle:$splunkSdkVersion")
  implementation("com.splunk:rum-integration-crash:$splunkSdkVersion")
  implementation("com.splunk:rum-integration-customtracking:$splunkSdkVersion")
  implementation("com.splunk:rum-integration-httpurlconnection-auto:$splunkSdkVersion")
  implementation("com.splunk:rum-integration-interactions:$splunkSdkVersion")
  implementation("com.splunk:rum-integration-navigation:$splunkSdkVersion")
  implementation("com.splunk:rum-integration-networkmonitor:$splunkSdkVersion")
  implementation("com.splunk:rum-integration-okhttp3-auto:$splunkSdkVersion")
  implementation("com.splunk:rum-integration-okhttp3-manual:$splunkSdkVersion")
  implementation("com.splunk:rum-integration-slowrendering:$splunkSdkVersion")
  implementation("com.splunk:rum-integration-startup:$splunkSdkVersion")
  implementation("com.splunk:rum-integration-webview:$splunkSdkVersion")

  compileOnly("com.splunk:rum-integration-sessionreplay:$splunkSdkVersion")

  coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")
}
