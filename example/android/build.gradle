buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
        splunkRumVersion = "2.3.2"
    }
    repositories {
        google()
        mavenCentral()
        // Splunk RUM plugins repository
        maven { url "https://splunk.jfrog.io/splunk/splunk-rum-android-releases" }
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")

        // Splunk RUM auto-instrumentation plugins
        classpath("com.splunk:rum-okhttp3-auto-plugin:${splunkRumVersion}")
        classpath("com.splunk:rum-httpurlconnection-auto-plugin:${splunkRumVersion}")
    }

    configurations.classpath {
        resolutionStrategy.activateDependencyLocking()
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "https://splunk.jfrog.io/splunk/splunk-rum-android-releases" }
    }
}

apply plugin: "com.facebook.react.rootproject"
