pre-commit:
  parallel: true
  commands:
    lint:
      glob: "*.{js,ts,jsx,tsx}"
      run: npx eslint {staged_files}
    types:
      glob: "*.{js,ts,jsx,tsx}"
      run: yarn workspace @splunk/otel-react-native tsc -p tsconfig.test.json && yarn workspace @splunk/otel-react-native typecheck && yarn workspace @splunk/otel-session-replay-react-native typecheck
    # frameworks:
      # Guard against committing vendored xcframeworks that leak absolute
      # build-machine paths / internal source structure.
      # glob: "packages/*/ios/frameworks/**"
      # run: bash scripts/sanitize-frameworks.sh --check
commit-msg:
  parallel: true
  commands:
    commitlint:
      run: npx commitlint --edit
