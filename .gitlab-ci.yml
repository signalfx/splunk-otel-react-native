default:
  image: 'node:22'

stages:
  - build
  - release

build_artifacts:
  stage: build
  only:
    - /^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/
  artifacts:
    paths:
      - dist/
  script:
    - corepack enable
    - yarn install --immutable
    - yarn build
    - rm -rf dist
    - mkdir -p dist
    - npm pack --ignore-scripts ./packages/core --pack-destination dist
    - npm pack --ignore-scripts ./packages/session-replay --pack-destination dist
    - ls -la dist/
    - sha256sum dist/*.tgz > dist/checksums.txt

release_npm:
  stage: release
  only:
    - /^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/
  needs:
    - job: build_artifacts
      artifacts: true
  dependencies:
    - build_artifacts
  artifacts:
    paths:
      - dist/
  script:
    - echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" > ~/.npmrc
    - for f in ./dist/*.tgz; do if [ ! -f "$f" ]; then echo "No tarballs found in dist/"; ls -la dist || true; exit 1; fi; if [ -n "$NPM_TAG" ]; then npm publish "$f" --tag "$NPM_TAG"; else npm publish "$f"; fi; done
    - rm -f ~/.npmrc
    
